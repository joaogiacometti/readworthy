# Example profile. Copy this folder to profile/ (git-ignored) and make it yours:
#
#   cp -r example-profile profile
#
# Who reads: a home cook who saves recipes and food articles to get better at cooking.
#
# For each bookmark, readworthy asks Jev one yes/no question built from the lists
# below: "Is it mainly about a topic you like, and not mainly one you dislike?"
# Anything else is archived in Karakeep, including pieces that match neither list.
#
# Check your changes with `python scripts/eval.py` against texts you labelled in
# eval/keep and eval/archive.

# Topics you want to read.
like = ["recipes", "cooking techniques", "fair tests of ingredients or equipment"]

# What you don't want, even when it is about a topic above: a chef feud is
# archived even though it's about cooking.
dislike = ["sales pitches", "rants", "feuds and gossip", "hype"]

# Keep when Jev's probability of "yes" is at least this; archive otherwise.
# Raise it to archive more, lower it to archive less.
keep_at = 0.5
