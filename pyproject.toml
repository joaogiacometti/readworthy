[project]
name = "readworthy"
version = "0.3.0"
description = "A Karakeep webhook that archives each bookmark whose main topic you don't like (Jev via OpenRouter)"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
readworthy = "readworthy.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["readworthy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
